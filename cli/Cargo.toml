[package]
name = "codex-bar-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool to monitor DeepSeek and StepFun coding plan usage"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
